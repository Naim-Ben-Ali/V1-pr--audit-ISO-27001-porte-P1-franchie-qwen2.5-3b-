# =====================================================================
# Référentiel de pré-audit documentaire — ISO/IEC 27001:2022, clauses 4 à 10
# ---------------------------------------------------------------------
# IMPORTANT (licence) : ce fichier contient uniquement des REFORMULATIONS
# originales et des numéros de référence. Il ne reproduit pas le texte de
# la norme. Garde la norme officielle (achetée) à part, et ne l'indexe
# jamais dans le corpus des documents du client.
#
# Chaque exigence est "atomique" : une seule chose à vérifier.
#   critique: true  -> une absence est classée NC majeure potentielle
#   doc_attendus    -> types de documents où chercher (voir types_documents)
#   mots_cles       -> termes FR/EN pour la recherche plein texte
# =====================================================================
version: "1.2.0"
# 1.2.0 : points à vérifier (attendus) explicites pour les exigences à plusieurs volets.
# 1.1.0 : couverture vérifiée contre le texte de la norme (clauses 4 à 10) fourni par l'utilisateur.
norme: "ISO/IEC 27001:2022"
perimetre: "Clauses 4 à 10 (V1)"

# ---------------------------------------------------------------------
# Types de documents reconnus à l'ingestion (classement par mots-clés
# dans le nom du fichier et le début du document).
# ---------------------------------------------------------------------
types_documents:
  norme_exclue:
    libelle: "Texte de la norme — exclu du corpus de preuves"
    mots_cles: []
  politique_ssi:
    libelle: "Politique de sécurité de l'information"
    mots_cles: ["politique de sécurité", "politique ssi", "pssi", "security policy", "information security policy", "politique générale"]
  perimetre:
    libelle: "Périmètre / domaine d'application du SMSI"
    mots_cles: ["périmètre", "domaine d'application", "scope", "perimetre du smsi"]
  manuel_smsi:
    libelle: "Manuel SMSI"
    mots_cles: ["manuel smsi", "manuel du smsi", "isms manual", "manuel de management"]
  contexte:
    libelle: "Contexte, enjeux et parties intéressées"
    mots_cles: ["contexte", "enjeux internes", "enjeux externes", "parties intéressées", "interested parties", "pestel", "swot"]
  roles:
    libelle: "Rôles et responsabilités"
    mots_cles: ["rôles et responsabilités", "roles and responsibilities", "organigramme", "raci", "fiche de poste", "lettre de nomination"]
  methodo_risques:
    libelle: "Méthodologie d'appréciation et de traitement des risques"
    mots_cles: ["méthodologie", "méthode d'appréciation", "risk methodology", "critères d'acceptation", "ebios", "iso 27005", "processus de gestion des risques"]
  registre_risques:
    libelle: "Registre / résultats d'appréciation des risques"
    mots_cles: ["registre des risques", "risk register", "analyse de risques", "appréciation des risques", "cartographie des risques", "risk assessment"]
  plan_traitement:
    libelle: "Plan de traitement des risques"
    mots_cles: ["plan de traitement", "risk treatment plan", "rtp", "traitement des risques"]
  soa:
    libelle: "Déclaration d'applicabilité (SoA)"
    mots_cles: ["déclaration d'applicabilité", "declaration d'applicabilite", "statement of applicability", "soa", "ddA"]
  objectifs:
    libelle: "Objectifs de sécurité et indicateurs"
    mots_cles: ["objectifs de sécurité", "objectifs ssi", "security objectives", "indicateurs", "kpi", "tableau de bord"]
  competences:
    libelle: "Compétences, formation, sensibilisation"
    mots_cles: ["plan de formation", "compétences", "sensibilisation", "awareness", "training", "attestation de formation", "matrice de compétences"]
  communication:
    libelle: "Plan de communication"
    mots_cles: ["plan de communication", "communication plan", "matrice de communication"]
  maitrise_documentaire:
    libelle: "Procédure de maîtrise des informations documentées"
    mots_cles: ["maîtrise des documents", "maitrise documentaire", "gestion documentaire", "document control", "informations documentées"]
  procedure:
    libelle: "Procédure / mode opératoire"
    mots_cles: ["procédure", "procedure", "mode opératoire", "instruction de travail", "processus"]
  surveillance:
    libelle: "Surveillance, mesure, résultats d'indicateurs"
    mots_cles: ["surveillance", "mesure", "monitoring", "rapport mensuel", "résultats des indicateurs", "reporting"]
  audit_interne:
    libelle: "Programme et rapports d'audit interne"
    mots_cles: ["audit interne", "internal audit", "programme d'audit", "plan d'audit", "rapport d'audit"]
  revue_direction:
    libelle: "Revue de direction"
    mots_cles: ["revue de direction", "management review", "compte rendu de revue", "pv de revue"]
  nc_actions:
    libelle: "Non-conformités et actions correctives"
    mots_cles: ["non-conformité", "non conformité", "action corrective", "corrective action", "registre des nc", "plan d'actions"]
  enregistrement:
    libelle: "Enregistrement / preuve"
    mots_cles: ["enregistrement", "preuve", "journal", "log", "compte rendu", "attestation", "liste d'émargement"]

