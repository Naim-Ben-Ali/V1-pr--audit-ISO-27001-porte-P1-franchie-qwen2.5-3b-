# ---------------------------------------------------------------------
# Exigences atomiques (reformulées)
# ---------------------------------------------------------------------
exigences:
  # ---------------- 4. Contexte ----------------
  - id: "4.1-R1"
    source: "4.1"
    theme: "Contexte de l'organisme"
    exigence: "Les enjeux internes et externes qui influencent la capacité du SMSI à atteindre ses résultats sont identifiés."
    doc_attendus: [contexte, manuel_smsi, perimetre]
    mots_cles: ["enjeux internes", "enjeux externes", "contexte", "pestel", "swot", "internal issues", "external issues"]
    critique: false
    questions_audit: ["Comment et à quelle fréquence les enjeux internes et externes sont-ils réexaminés ?"]
  - id: "4.2-R1"
    source: "4.2"
    theme: "Contexte de l'organisme"
    exigence: "Les parties intéressées pertinentes pour le SMSI sont identifiées."
    doc_attendus: [contexte, manuel_smsi]
    mots_cles: ["parties intéressées", "interested parties", "parties prenantes", "stakeholders"]
    critique: false
    questions_audit: ["Qui tient à jour la liste des parties intéressées ?"]
  - id: "4.2-R2"
    source: "4.2"
    theme: "Contexte de l'organisme"
    exigence: "Les exigences pertinentes de ces parties intéressées, y compris légales, réglementaires et contractuelles, sont déterminées."
    doc_attendus: [contexte, manuel_smsi]
    mots_cles: ["exigences légales", "réglementaires", "contractuelles", "attentes", "requirements", "loi", "rgpd", "protection des données"]
    critique: false
    questions_audit: ["Comment la veille réglementaire est-elle organisée ?"]
  - id: "4.2-R3"
    source: "4.2"
    theme: "Contexte de l'organisme"
    exigence: "L'organisme indique lesquelles de ces exigences sont prises en charge par le SMSI."
    doc_attendus: [contexte, manuel_smsi]
    mots_cles: ["prises en compte", "traitées par le smsi", "addressed", "couvertes"]
    critique: false
    questions_audit: []
  - id: "4.3-R1"
    source: "4.3"
    theme: "Contexte de l'organisme"
    exigence: "Le périmètre du SMSI est défini et disponible sous forme documentée."
