    mots_cles: ["périmètre", "domaine d'application", "scope", "sites", "activités couvertes"]
    critique: true
    questions_audit: ["Le périmètre a-t-il été validé par la direction ?"]
  - id: "4.3-R2"
    source: "4.3"
    theme: "Contexte de l'organisme"
    exigence: "Le périmètre décrit les limites, les interfaces et les dépendances avec les activités réalisées par d'autres organismes."
    doc_attendus: [perimetre, manuel_smsi]
    mots_cles: ["interfaces", "dépendances", "limites", "exclusions", "sous-traitants", "prestataires", "dependencies"]
    critique: false
    questions_audit: ["Quelles activités externalisées sont en interface avec le périmètre ?"]
  - id: "4.3-R3"
    source: "4.3"
    theme: "Contexte de l'organisme"
    exigence: "La définition du périmètre tient compte des enjeux identifiés (4.1) et des exigences des parties intéressées (4.2)."
